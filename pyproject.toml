[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solsigs-py"
version = "0.1.0"
description = "Python client for SolSigs — pay-per-call Solana data APIs via x402 micropayments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SolSigs", email = "hello@solsigs.com"}
]
keywords = ["solana", "x402", "ai-agents", "defi", "micropayments", "web3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.28",
    "httpx>=0.24",
]

[project.scripts]
solsigs-mcp = "solsigs.mcp_proxy:main"

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]
solana = [
    "solana>=0.30",
    "solders>=0.20",
]

[project.urls]
Homepage = "https://solsigs.com"
Repository = "https://github.com/gra-kir/solsigs-py"
Documentation = "https://solsigs.com/docs"

[tool.setuptools.packages.find]
include = ["solsigs*"]