[package]
name = "conditional-escrow"
version = "0.1.0"
description = "Non-custodial conditional-settlement escrow for the `conditional` payment scheme"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "conditional_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
